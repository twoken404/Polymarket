name: 更新 Polymarket 数据并生成页面

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:          # 添加这行
      contents: write     # 添加这行

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # 添加这行

      - name: 获取 API 数据
        run: |
          echo "📦 正在获取 Polymarket 数据..."
          curl -s "https://gamma-api.polymarket.com/events?active=true&closed=false&limit=5" > data.json
          echo "✅ data.json 已更新，大小：$(wc -c < data.json) 字节"

      - name: 生成 index.html
        run: |
          echo "🎨 正在生成美观的 index.html..."
          python3 generate_html.py

      - name: 提交变更
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "每日数据更新 $(date +'%Y-%m-%d')"
          git push