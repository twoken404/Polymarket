name: 更新 Polymarket 数据并生成页面

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0 点运行（北京时间 8 点）
  workflow_dispatch:       # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取 API 数据
        run: |
          echo "📦 正在获取 Polymarket 数据..."
          curl -s "https://gamma-api.polymarket.com/events?active=true&closed=false&limit=5" > data.json
          echo "✅ data.json 已更新，大小：$(wc -c < data.json) 字节"

      - name: 生成 index.html
        run: |
          echo "🎨 正在生成美观的 index.html..."
          python3 generate_html.py   # 使用 Python 脚本生成 HTML（见下文）

      - name: 提交变更
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json index.html
          # 仅当有变化时才提交
          git diff --quiet && git diff --staged --quiet || git commit -m "每日数据更新 $(date +'%Y-%m-%d')"
          git push